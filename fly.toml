# Fly.io configuration for the scan service.
#
# First deploy, from this folder, once the Fly account exists:
#   fly launch --no-deploy --copy-config --name smart-scale-scan
#   fly secrets set SSA_WORKER_SECRET=<the same value the website holds>
#   fly deploy
#   fly scale count 1
#   curl https://smart-scale-scan.fly.dev/health
#
# Deployed 2026-10-03. Later deploys are just `fly deploy`. Keep one machine:
# the queue lives in memory, and a first deploy creates two. `fly launch`
# rewrites this file and adds a .github deploy workflow; undo both.
#
# The machine stops when idle and starts on the first request, so a scan
# that arrives after a quiet spell waits a few seconds longer. The service
# stops itself (SSA_IDLE_EXIT_SECONDS): Fly's own auto-stop is off because
# it cannot see a scan in progress and stopped the machine mid-scan. Lead mode
# runs two Chrome processes at once, which is what the two processors and
# the memory are for.

app = "smart-scale-scan"
primary_region = "dfw"

[build]

[env]
  SSA_CALLBACK_HOST = "smartscaleagent.com"
  SSA_QUEUE_MAX = "10"
  SSA_IDLE_EXIT_SECONDS = "300"
  # Set to "1" only if Chrome refuses to start in the sandbox on this host.
  # SSA_NO_SANDBOX = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health"

# A clean exit (idle) leaves the machine stopped; a crash restarts it.
[[restart]]
  policy = "on-failure"
  retries = 5

# Dedicated processors. The shared size is throttled after a short burst,
# and a few scans in a row then ran three times slower and hit the scan's
# time limit (measured 2026-10-05). It is billed only while it runs.
[[vm]]
  size = "performance-2x"
  memory = "4gb"
